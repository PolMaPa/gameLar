# =============================================================================
# Nginx · DESARROLLO LOCAL
#
# - Sirve /var/www/html/public (assets copiados en la imagen).
# - Envía las peticiones PHP a PHP-FPM (servicio "app", puerto 9000).
# - Sin TLS: Docker publica el puerto 8080 en localhost.
# =============================================================================

upstream gamehub_php {
    server app:9000;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel: todo lo que no sea un archivo real pasa por index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass gamehub_php;
        fastcgi_hide_header X-Powered-By;
    }

    # Caché de assets estáticos compilados por Vite.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # No servir archivos ocultos (.env, .git, etc.).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
