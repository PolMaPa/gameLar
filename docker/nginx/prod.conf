# =============================================================================
# Nginx · PRODUCCIÓN (VPS Ubuntu)
#
# - Sirve la app en el puerto 80 del contenedor.
# - El TLS se termina delante (proxy del proveedor) o con el bloque 443
#   comentado al final, una vez emitido el certificado.
# - Compresión y caché de estáticos activadas.
# =============================================================================

upstream gamehub_php {
    server app:9000;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;
    server_tokens off;

    # Cabeceras de seguridad.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compresión.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
        fastcgi_pass gamehub_php;
        fastcgi_hide_header X-Powered-By;
    }

    # Assets con hash de Vite: se pueden cachear de forma agresiva.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # -------------------------------------------------------------------------
    # HTTPS: descomentar cuando exista el certificado en el VPS
    # (por ejemplo con Certbot: /etc/letsencrypt/live/tu-dominio/).
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name tu-dominio.example;
    #
    #     ssl_certificate     /etc/letsencrypt/live/tu-dominio.example/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/tu-dominio.example/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #
    #     ... (repetir root, locations y cabeceras de arriba) ...
    # }
    # -------------------------------------------------------------------------
}
