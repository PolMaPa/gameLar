; Configuración de PHP para los contenedores de GameHub.
; Se copia a /usr/local/etc/php/conf.d/zz-gamehub.ini

expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 60
date.timezone = UTC

; OPcache: rendimiento en producción. Con validate_timestamps=0 los cambios de
; código requieren reconstruir la imagen (que es justo lo que hace el CD).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
