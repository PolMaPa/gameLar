name: CD · Laravel Cloud

# Se ejecuta cuando termina el workflow "CI". El job solo continúa si:
#   - el CI terminó con éxito,
#   - el evento original fue un push (no una pull request),
#   - la rama es main.
#
# No se ejecuta ningún comando de build ni de test aquí: Laravel Cloud hace
# su propio build y sus migraciones a partir del commit indicado.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Evita que dos despliegues se solapen. No cancela el que esté en curso.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar en producción
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Crea un deployment en GitHub y permite añadir más adelante reglas de
    # protección (por ejemplo, revisores obligatorios) en Settings > Environments.
    environment:
      name: production

    steps:
      - name: Comprobar que existe el deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error title=CD sin configurar::Falta el secreto LARAVEL_CLOUD_DEPLOY_HOOK en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Desencadenar el despliegue en Laravel Cloud
        env:
          DEPLOY_HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Solicitando a Laravel Cloud el despliegue del commit ${COMMIT_SHA}"
          curl --fail-with-body --silent --show-error \
            -X POST "${DEPLOY_HOOK}?commit_hash=${COMMIT_SHA}"

      - name: Publicar el resumen
        if: always()
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            echo "## CD · Laravel Cloud"
            echo ""
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Commit desplegado | \`${COMMIT_SHA}\` |"
            echo "| CI previo | [ver ejecución](${CI_RUN_URL}) |"
            echo "| Estado | **${{ job.status }}** |"
            echo ""
            echo "El build, las migraciones y el health check se ejecutan en Laravel Cloud."
          } >> "$GITHUB_STEP_SUMMARY"
